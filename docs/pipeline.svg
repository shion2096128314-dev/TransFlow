<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" role="img">
  <title>TransFlow 翻译流水线四步分工</title>
  <desc>RapidOCR 定位文字框，Hy-MT2 只翻译文字，OpenCV 擦除原字，Pillow 把译文嵌回气泡</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="28" font-size="15" font-weight="500" fill="#26215C" dominant-baseline="central">TransFlow 流水线：贴回画面是另外三个组件的活</text>
  <text x="106" y="52" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">输入：日文漫画图</text>
  <text x="574" y="52" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">输出：中文成品图</text>
  <g>
    <rect x="40" y="64" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="106" y="84" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">RapidOCR 找文字框</text>
    <text x="106" y="103" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">标出每个文字的位置</text>
  </g>
  <g>
    <rect x="196" y="64" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="262" y="84" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Hy-MT2 翻译</text>
    <text x="262" y="103" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">文字进，译文出</text>
  </g>
  <g>
    <rect x="352" y="64" width="132" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="418" y="84" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">OpenCV 擦除</text>
    <text x="418" y="103" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">抹掉原来的字</text>
  </g>
  <g>
    <rect x="508" y="64" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="574" y="84" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Pillow 嵌回</text>
    <text x="574" y="103" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">译文写回气泡里</text>
  </g>
  <path d="M174 92 L194 92" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M330 92 L350 92" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M486 92 L506 92" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M262 120 L262 138" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g>
    <rect x="142" y="138" width="240" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="262" y="158" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Hy-MT2 只负责中间这一步</text>
    <text x="262" y="177" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">纯文本模型，看不见图片，也不会嵌字</text>
  </g>
</svg>
